name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          python -m py_compile softether_jp.py relays.py
          sh -n softether-jp-helper
      - name: Unit tests
        run: python -m unittest discover -s tests -v

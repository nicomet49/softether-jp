name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime libraries
        run: sudo apt-get update && sudo apt-get install -y gir1.2-gtk-4.0 python3-gi python3-requests
      - name: Syntax checks
        run: |
          python -m py_compile softether_jp.py
          sh -n softether-jp-helper
      - name: Unit tests
        run: python -m unittest discover -s tests -v
